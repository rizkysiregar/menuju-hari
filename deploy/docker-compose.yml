# Menuju Hari — dependency lokal untuk development
# Jalankan: docker compose -f deploy/docker-compose.yml up -d

services:
  postgres:
    image: postgres:17-alpine
    container_name: menujuhari-postgres
    environment:
      POSTGRES_USER: menujuhari
      POSTGRES_PASSWORD: menujuhari
      POSTGRES_DB: identity_db
    ports:
      - "5432:5432"
    volumes:
      - menujuhari_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U menujuhari -d identity_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: menujuhari-redis
    ports:
      - "6379:6379"
    volumes:
      - menujuhari_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # MinIO lokal untuk dev. CATATAN (Okt 2026): minio/minio sudah dihapus dari
  # Docker Hub & CE diarsipkan — dev pakai fork Chainguard; VM memakai image
  # lama ter-cache. Migrasi ke R2/S3 lain ada di risk register.
  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: menujuhari-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: menujuhari
      MINIO_ROOT_PASSWORD: menujuhari-dev-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  menujuhari_pgdata:
  menujuhari_redisdata:
