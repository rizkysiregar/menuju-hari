spring:
  application:
    name: media-service
  # .env ditangani DotEnvEnvironmentPostProcessor (lihat identity-service).
  datasource:
    # Konvensi proyek: PostgreSQL di infra VM, user sama, beda nama DB saja.
    url: jdbc:postgresql://${DB_HOST:192.168.1.50}:${DB_PORT:5433}/${DB_NAME:media_db}
    username: ${DB_USER:infra_dev_admin}
    password: ${DB_PASSWORD:}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC

  flyway:
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:192.168.1.50}
      port: ${REDIS_PORT:6379}

server:
  port: ${SERVER_PORT:8084}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /docs

minio:
  # Produksi/VM: http://192.168.1.50:9000 — kredensial di .env (tidak di-commit).
  endpoint: ${MINIO_ENDPOINT:http://192.168.1.50:9000}
  access-key: ${MINIO_ACCESS_KEY:}
  secret-key: ${MINIO_SECRET_KEY:}
  bucket: ${MINIO_BUCKET:menujuhari}

mh:
  env:
    file: services/media-service/.env
  security:
    cookie-name: mh_session
    session-ttl: 14d
    cookie-secure: true
    allowed-origins: ${APP_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
    permit-all-paths:
      - /actuator/health/**
    api-docs-enabled: true
    openapi:
      title: Media Service API
      description: Unggah foto undangan (presigned), varian gambar, dan streaming musik
      version: 0.1.0

app:
  media:
    max-size-bytes: 5242880          # 5 MB (MEDIA-001)
    max-dimension: 4000              # px (MEDIA-001)
    max-photos-per-user: 60          # anti-abuse; kuota per-paket divalidasi saat konten
    presign-upload-ttl: 10m
    presign-read-ttl: 1h
  catalog:
    base-url: ${CATALOG_BASE_URL:http://localhost:8083}
