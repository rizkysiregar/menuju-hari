spring:
  application:
    name: payment-service
  # .env ditangani DotEnvEnvironmentPostProcessor (lihat identity-service).
  datasource:
    # Konvensi proyek: PostgreSQL di infra VM, user sama, beda nama DB saja.
    url: jdbc:postgresql://${DB_HOST:192.168.1.50}:${DB_PORT:5433}/${DB_NAME:payment_db}
    username: ${DB_USER:infra_dev_admin}
    password: ${DB_PASSWORD:}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC

  flyway:
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:192.168.1.50}
      port: ${REDIS_PORT:6379}

server:
  port: ${SERVER_PORT:8086}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /docs

midtrans:
  # true = sandbox (dashboard.sandbox.midtrans.com), false = produksi.
  # ServerKey & ClientKey: Dashboard -> Settings -> Access Keys.
  is-sandbox: ${MIDTRANS_IS_SANDBOX:true}
  server-key: ${MIDTRANS_SERVER_KEY:}
  client-key: ${MIDTRANS_CLIENT_KEY:}
  merchant-id: ${MIDTRANS_MERCHANT_ID:}

mh:
  env:
    file: services/payment-service/.env
  security:
    cookie-name: mh_session
    session-ttl: 14d
    cookie-secure: true
    allowed-origins: ${APP_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
    permit-all-paths:
      # Webhook Midtrans (signature diverifikasi di dalam; PAY-002)
      - /v1/webhooks/**
      # Internal antar-service: tidak terekspos internet saat deploy
      - /internal/**
      - /actuator/health/**
    api-docs-enabled: true
    openapi:
      title: Payment Service API
      description: Integrasi Midtrans Snap — session, webhook, rekonsiliasi
      version: 0.1.0
