spring:
  application:
    name: order-service
  # .env ditangani DotEnvEnvironmentPostProcessor (lihat identity-service).
  datasource:
    # Konvensi proyek: PostgreSQL di infra VM, user sama, beda nama DB saja.
    url: jdbc:postgresql://${DB_HOST:192.168.1.50}:${DB_PORT:5433}/${DB_NAME:order_db}
    username: ${DB_USER:infra_dev_admin}
    password: ${DB_PASSWORD:}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC

  flyway:
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:192.168.1.50}
      port: ${REDIS_PORT:6379}

server:
  port: ${SERVER_PORT:8085}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /docs

mh:
  env:
    file: services/order-service/.env
  security:
    cookie-name: mh_session
    session-ttl: 14d
    cookie-secure: true
    allowed-origins: ${APP_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
    permit-all-paths:
      - /actuator/health/**
    api-docs-enabled: true
    openapi:
      title: Order Service API
      description: Checkout, kupon, dan riwayat order Menuju Hari
      version: 0.1.0

app:
  order:
    order-ttl-hours: 24
    order-number-max-attempts: 5
    catalog-base-url: ${CATALOG_BASE_URL:http://localhost:8083}
    payment-base-url: ${PAYMENT_BASE_URL:http://localhost:8086}
