spring:
  application:
    name: catalog-service
  # .env ditangani DotEnvEnvironmentPostProcessor (lihat identity-service).
  datasource:
    # Konvensi proyek: PostgreSQL di infra VM, user sama, beda nama DB saja.
    url: jdbc:postgresql://${DB_HOST:192.168.1.50}:${DB_PORT:5433}/${DB_NAME:catalog_db}
    username: ${DB_USER:infra_dev_admin}
    password: ${DB_PASSWORD:}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC

  flyway:
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:192.168.1.50}
      port: ${REDIS_PORT:6379}

server:
  port: ${SERVER_PORT:8083}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /docs

mh:
  env:
    file: services/catalog-service/.env
  security:
    cookie-name: mh_session
    session-ttl: 14d
    cookie-secure: true
    allowed-origins: ${APP_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
    permit-all-paths:
      # Paket harga dipakai landing page (publik, cacheable).
      - /v1/catalog/packages
      - /v1/catalog/packages/**
      # Internal antar-service: tidak terekspos internet saat deploy (Ingress
      # hanya me-route route publik); lokal digunakan invitation-service.
      - /internal/**
      - /actuator/health/**
    api-docs-enabled: true
    openapi:
      title: Catalog Service API
      description: Template undangan, paket harga, dan katalog musik Menuju Hari
      version: 0.1.0
