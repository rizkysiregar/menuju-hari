spring:
  application:
    name: identity-service
  # .env TIDAK dibaca lewat spring.config.import (rapuh terhadap working
  # directory). Penemuan file ditangani DotEnvEnvironmentPostProcessor di
  # security-starter: berjalan naik dari working directory hingga menemukan
  # <root-repo>/<mh.env.file>. Urutan prioritas: env var OS > .env > yml.

  datasource:
    # Konvensi proyek: PostgreSQL selalu di infra VM (192.168.1.50), user sama,
    # yang berbeda hanya nama database-nya. Password TIDAK punya default —
    # wajib diisi lewat .env (tidak pernah di-commit).
    url: jdbc:postgresql://${DB_HOST:192.168.1.50}:${DB_PORT:5433}/${DB_NAME:identity_db}
    username: ${DB_USER:infra_dev_admin}
    password: ${DB_PASSWORD:}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC

  flyway:
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:192.168.1.50}
      port: ${REDIS_PORT:6379}

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

server:
  port: ${SERVER_PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
  health:
    mail:
      # Kegagalan SMTP tidak menurunkan readiness — kegagalan kirim OTP
      # ditangani di level pengiriman (user dapat minta ulang).
      enabled: false

springdoc:
  swagger-ui:
    path: /docs

mh:
  env:
    # Path relatif dari root repo — ditangkap oleh DotEnvEnvironmentPostProcessor
    file: services/identity-service/.env
  security:
    cookie-name: mh_session
    session-ttl: 14d
    cookie-secure: true
    allowed-origins: ${APP_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
    permit-all-paths:
      - /v1/auth/otp/request
      - /v1/auth/otp/verify
      - /actuator/health/**
    api-docs-enabled: true
    openapi:
      title: Identity Service API
      description: Autentikasi OTP email dan manajemen sesi Menuju Hari
      version: 0.1.0

app:
  otp:
    ttl: 5m
    max-attempts: 5
    cooldown: 60s
    max-per-email-per-hour: 5
    max-per-email-per-day: 10
    max-per-ip-per-hour: 20
  mail:
    from: ${MAIL_FROM:Menuju Hari <no-reply@menujuhari.id>}
    # true = cetak OTP ke log (HANYA dev lokal tanpa kredensial Gmail).
    console-fallback: ${MAIL_CONSOLE_FALLBACK:false}
